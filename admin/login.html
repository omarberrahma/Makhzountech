<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakhzounTech - Super Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-amber-500 text-slate-950 flex items-center justify-center font-black text-2xl mx-auto shadow-lg shadow-amber-500/20">M</div>
      <h1 class="font-extrabold text-2xl text-white">تسجيل الدخول - Super Admin</h1>
      <p class="text-xs text-slate-400">لوحة مالك المنصة السحابية MakhzounTech SaaS</p>
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='/admin/index.html';" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 mb-1">البريد الإلكتروني للإدارة</label>
        <input type="email" required value="admin@makhzountech.dz" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-amber-500" />
      </div>
      <div>
        <label class="block text-slate-400 mb-1">كلمة المرور المشفرة</label>
        <input type="password" required value="••••••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-amber-500" />
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20">
        الدخول للوحة التحكم السحابية
      </button>
    </form>
  </div>
</body>
</html>
